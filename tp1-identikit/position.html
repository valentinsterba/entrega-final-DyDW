<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo TF2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        img {
            width: 200px;
        }

        div {
            background-color: blue;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #prim {
            position: absolute;
        }

        #seg {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #terc {
            position: absolute;
            right: 0;
        }

        #cuar {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        #quin {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #sext {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        #sept {
            position: absolute;
            left: 0;
            bottom: 0;
        }

        #oct {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
        }

        #nov {
            position: absolute;
            right: 0;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div>
        <img id="prim" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="seg" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="terc" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="cuar" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="quin" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="sext" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="sept" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="oct" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
        <img id="nov" src="imagenes/LogoTF2.svg" alt="Logo de Team Fortress 2">
    </div>
</body>
</html>
